workflows:
  total-music-verify:
    name: Total Music - installable test APK
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      java: 21
      vars:
        ORG_GRADLE_PROJECT_spaceNdkVersion: "27.0.12077973"
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Verify source provenance
        script: |
          set -eu
          git fetch origin 369a1f68e80dae6780d317e82d226bff06d37b01
          git merge-base --is-ancestor 369a1f68e80dae6780d317e82d226bff06d37b01 HEAD
      - name: Install Android SDK components
        script: |
          set -eu
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk_manager" ]; then
            sdk_manager=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties
      - name: Run regression tests and build Total Music
        script: |
          set -eu
          chmod +x gradlew
          ./gradlew '-Dorg.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true' --max-workers=2 :shared:jvmTest :app:testProdDebugUnitTest :app:lintProdDebug :app:assembleProdDebug -PspaceSpatialEdition=true --build-cache --stacktrace
      - name: Package and verify signed APK
        script: |
          set -eu
          mkdir -p distribution
          apk=$(find app/build/outputs/apk -name '*universal*debug.apk' | head -1)
          test -n "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          "$sdk_root/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > distribution/signature-verification.txt
          cp "$apk" distribution/Total-Music-1.0.1-test-universal.apk
          shasum -a 256 distribution/Total-Music-1.0.1-test-universal.apk > distribution/SHA256.txt
          zip -j Total-Music-1.0.1-test-install.zip distribution/*
      - name: Identify source artifacts
        script: |
          set -eu
          mkdir -p verification
          printf '%s\n' 'Installable standalone test build using Android debug signature. Not a production release or an update for Space Music.' > verification/README.txt
          git rev-parse HEAD > verification/source-commit.txt
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/reports/**/*
      - shared/build/reports/tests/**/*
      - verification/*
      - Total-Music-1.0.1-test-install.zip
