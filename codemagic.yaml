workflows:
  total-music-release:
    name: Total Music - release for private signing
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: total-music-1.1.0-expressive-eq
          include: true
      cancel_previous_builds: true
    environment:
      java: 21
      vars:
        ORG_GRADLE_PROJECT_spaceNdkVersion: "27.0.12077973"
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Verify source provenance
        script: |
          set -eu
          git fetch origin 369a1f68e80dae6780d317e82d226bff06d37b01
          git merge-base --is-ancestor 369a1f68e80dae6780d317e82d226bff06d37b01 HEAD
          python3 scripts/release/check_release.py
      - name: Install Android SDK components
        script: |
          set -eu
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk_manager" ]; then
            sdk_manager=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties
      - name: Run regression tests and build Total Music
        script: |
          set -eu
          chmod +x gradlew
          ./gradlew '-Dorg.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true' --max-workers=2 :shared:jvmTest :app:testProdDebugUnitTest :app:lintProdDebug :app:assembleProdRelease -PspaceSpatialEdition=true --build-cache --stacktrace
      - name: Package unsigned release for private signing
        script: |
          set -eu
          mkdir -p release-artifacts
          apk=$(find app/build/outputs/apk -name '*universal*release-unsigned.apk' | head -1)
          test -n "$apk"
          version=$(sed -n 's/^versionName=//p' total-music-release.properties)
          cp "$apk" "release-artifacts/Total-Music-${version}-unsigned.apk"
          cp total-music-release.properties release-artifacts/
          git rev-parse HEAD > release-artifacts/source-commit.txt
          (cd release-artifacts && shasum -a 256 *.apk > SHA256SUMS.txt)
          (cd release-artifacts && zip -9 "../Total-Music-${version}-unsigned.zip" ./*)
    artifacts:
      - Total-Music-*-unsigned.zip
      - app/build/reports/**/*
      - shared/build/reports/tests/**/*
