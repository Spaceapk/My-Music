name: Star Music Android verification
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'CHANGELOG.md', 'docs/**', '.signing/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: star-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'cmake;3.22.1'
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Regression tests
        run: |
          chmod +x gradlew
          ./gradlew :shared:jvmTest :app:testProdDebugUnitTest --build-cache --stacktrace
      - name: Android lint verification
        run: ./gradlew :app:lintProdDebug :app:lintVitalProdRelease --build-cache --stacktrace
      - name: Build release and test APKs
        run: ./gradlew :app:assembleProdRelease :app:assembleProdDebug :app:assembleProdDebugAndroidTest --build-cache --stacktrace
      - name: Build instrumentation for the optimized release
        run: ./gradlew :app:assembleProdReleaseAndroidTest -PstarTestBuildType=release --build-cache --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: star-android-build
          path: |
            app/build/outputs/apk/
            app/build/reports/
            shared/build/reports/tests/
          if-no-files-found: error
  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: star-android-build
          path: built
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify persistence and offline playback on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan
          disable-animations: true
          script: bash scripts/test-device.sh
      - name: Retain Android startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-device-test-diagnostics
          path: |
            device-tests.txt
            device-startup-log.txt
            device-crash-log.txt
