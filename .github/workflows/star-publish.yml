name: Publish verified Star Music beta
on:
  workflow_run:
    workflows: ['Star Music Android verification']
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: star-first-beta-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check version has not already been published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" != "$VERIFIED_SHA" ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif gh release view v1.0.0-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.release.outputs.exists == 'false'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: steps.release.outputs.exists == 'false'
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        if: steps.release.outputs.exists == 'false'
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.exists == 'false'
        with:
          name: star-android-build
          path: built
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Create or reuse encrypted Star Music signing key
        if: steps.release.outputs.exists == 'false'
        env:
          STAR_PASSWORD: ${{ secrets.STAR_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STAR_PASSWORD"
          mkdir -p .signing
          if [ ! -f .signing/star-release.p12 ]; then
            keytool -genkeypair -keystore .signing/star-release.p12 -storetype PKCS12 -alias star-music \
              -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=Star Music, OU=Android, O=nexlibre' \
              -storepass:env STAR_PASSWORD -keypass:env STAR_PASSWORD
          fi
          # PKCS12 is encrypted. The high-entropy password exists only in repository secrets.
          keytool -list -keystore .signing/star-release.p12 -storepass:env STAR_PASSWORD -alias star-music
      - name: Sign and verify APKs
        if: steps.release.outputs.exists == 'false'
        env:
          STAR_PASSWORD: ${{ secrets.STAR_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0'
          mkdir -p dist
          universal=$(find built -path '*/prod/release/*' -name '*universal*.apk' | head -1)
          x86=$(find built -path '*/prod/release/*' -name '*x86_64*.apk' | head -1)
          tests=$(find built -path '*/androidTest/prod/release/*' -name '*.apk' | head -1)
          test -n "$universal"; test -n "$x86"; test -n "$tests"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign --ks .signing/star-release.p12 --ks-key-alias star-music --ks-pass env:STAR_PASSWORD --key-pass env:STAR_PASSWORD --out dist/Star-Music-1.0.0-beta.apk "$universal"
          "$signer" sign --ks .signing/star-release.p12 --ks-key-alias star-music --ks-pass env:STAR_PASSWORD --key-pass env:STAR_PASSWORD --out dist/test-release.apk "$x86"
          "$signer" sign --ks .signing/star-release.p12 --ks-key-alias star-music --ks-pass env:STAR_PASSWORD --key-pass env:STAR_PASSWORD --out dist/test-runner.apk "$tests"
          "$signer" verify --verbose --print-certs dist/Star-Music-1.0.0-beta.apk | tee dist/signature-verification.txt
          "$signer" verify dist/test-release.apk
          "$signer" verify dist/test-runner.apk
      - name: Enable KVM
        if: steps.release.outputs.exists == 'false'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install signed release and verify offline playback
        if: steps.release.outputs.exists == 'false'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan
          disable-animations: true
          script: TEST_APP_APK=dist/Star-Music-1.0.0-beta.apk TEST_INSTRUMENTATION_APK=dist/test-runner.apk bash scripts/test-device.sh
      - name: Retain signed APK and verification evidence
        if: always() && steps.release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: star-signed-release-evidence
          path: |
            dist/Star-Music-1.0.0-beta.apk
            dist/signature-verification.txt
            device-tests.txt
            device-startup-log.txt
            device-crash-log.txt
            device-full-log.txt
      - name: Publish beta after all checks pass
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$VERIFIED_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text().replace('**Beta 1.0.0 en preparación: todavía no hay un APK verificado publicado.**', '**[Descargar Star Music Beta 1.0.0 — APK Android](https://github.com/nexlibre/Star-Music/releases/download/v1.0.0-beta/Star-Music-1.0.0-beta.apk)**')
          p.write_text(text)
          p = Path('CHANGELOG.md')
          p.write_text(p.read_text().replace('Estado: pendiente de completar y verificar compilación, pruebas Android, firma y publicación.', 'Estado: compilación, pruebas de regresión, persistencia y reproducción sin red en Android 13 (API 33), instalación de release y firma verificadas automáticamente. Las pruebas automatizadas no sustituyen pruebas en todos los dispositivos físicos.'))
          PY
          git config user.name nexlibre
          git config user.email 134002775+nexlibre@users.noreply.github.com
          git add README.md CHANGELOG.md
          git add -f .signing/star-release.p12
          git commit -m 'release: retain encrypted signing key and expose verified beta download'
          git push origin HEAD:main
          git tag v1.0.0-beta
          git push origin v1.0.0-beta
          (cd dist && sha256sum Star-Music-1.0.0-beta.apk > SHA256SUMS.txt)
          cat > dist/RELEASE-NOTES.md <<'NOTES'
          Star Music Beta 1.0.0: derivación independiente de BitChord, con nombre, icono y paquete Android propios.

          Listas de archivos locales: crear, renombrar, eliminar, añadir canciones, quitarlas y cambiar su orden. Guardado en el dispositivo y reproducción sin cuenta ni conexión.

          Instalación: descarga Star-Music-1.0.0-beta.apk. Requiere Android 8.0 o posterior. Se instala como una aplicación independiente.

          Validación: compilación release, pruebas de regresión, persistencia tras recarga, reproducción de audio local con Wi-Fi y datos desactivados, instalación y arranque del APK release firmado en Android 13 (API 33). Pendiente de validación manual en distintos teléfonos físicos.

          Código GPL-3.0. Créditos a kushagrasinghx y los colaboradores de BitChord. El historial, la licencia y los avisos originales se conservan. No hay afiliación con el proyecto original.
          NOTES
          printf '\nCompilación verificada: %s\nCommit de código verificado: %s\n' "$VERIFIED_RUN" "$VERIFIED_SHA" >> dist/RELEASE-NOTES.md
          gh release create v1.0.0-beta dist/Star-Music-1.0.0-beta.apk dist/SHA256SUMS.txt dist/signature-verification.txt device-tests.txt \
            --repo "$GITHUB_REPOSITORY" --prerelease --title 'Star Music Beta 1.0.0' --notes-file dist/RELEASE-NOTES.md
